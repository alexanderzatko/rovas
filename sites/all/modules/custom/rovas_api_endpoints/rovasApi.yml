      - oauth-merit-index
      summary: Country filter options for Merit index
      security: *id002
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
      responses:
        '200':
          description: Country list
  /rovas/civic_merit_spotlight:
    get:
      tags:
      - oauth-merit-index
      summary: Period leads by Civic area
      security: *id002
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
      - in: query
        name: period
        required: false
        schema:
          type: string
          enum:
          - today
          - day
          - week
          - month
      responses:
        '200':
          description: Spotlight leads
  /rovas/civic_merit_period_index:
    get:
      tags:
      - oauth-merit-index
      summary: ME•ter period leaderboard
      security: *id002
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
      responses:
        '200':
          description: Period leaderboard
components:
  schemas:
    NewProject:
      required:
      - project_name
      - project_status
      - project_participation
      type: object
      properties:
        project_name:
          type: string
          example: Test project title
        project_url:
          type: string
          example: https://nabezky.sk/node/388383
        project_price:
          type: number
          format: float
          example: 2.3
        project_status:
          type: integer
          description: 0 unfinished, 1 for sale, 2 sold, 3 expired
          enum:
          - 0
          - 1
          - 2
          - 3
        project_participation:
          type: integer
          description: 0 - Private, 1 - Public, 2 - Public - dependent on parent project
          enum:
          - 0
          - 1
          - 2
        project_description:
          type: string
          example: Report from a ski trip
    NewProjectResponse:
      type: object
      properties:
        created_project_nid:
          type: integer
          description: A greater than 0 new project ID.
          example: 19928
    NewWorkReport:
      description: ''
      required:
      - wr_classification
      - wr_activity_name
      - wr_hours
      - wr_web_address
      - date_started
      - publish_status
      - parent_project_nid
      type: object
      properties:
        wr_classification:
          $ref: '#/components/schemas/RovasTerms'
        wr_description:
          type: string
          description: accepts HTML tags
          example: Moved a big rock up the hill, but it fell back. Will continue rolling tomorrow.
        wr_activity_name:
          type: string
          description: title of work report - activity summary
          example: Rock moving
        wr_hours:
          type: number
          format: float
          description: time in hours
          example: 2.5
        wr_web_address:
          type: string
          description: URL of a proof for the work performed
          example: https://nabezky.sk/node/3883
        parent_project_nid:
          type: integer
          format: int64
          description: parent project node ID
          example: 28388348
        date_started:
          type: integer
          format: int64
          description: the date and time in UNIX timestamp format; must be within the last 30 days
          example: 1594538979
        access_token:
          type: string
          description: A text string of sufficient length and complexity that - when presented as URL
            argument 'cbt' attached to the address in the wr_web_address field - will allow unauthenticated
            access to the proof of work in that web page
          example: 7JH_hdjd83%ks
        publish_status:
          type: integer
          format: int64
          description: if greater than 0, the report will be published; unpublished otherwise. No verifiers
            are invited for unpublished reports
          example: 1
        reward_kind:
          type: string
          enum:
          - merits
          - chrons
          default: chrons
          description: Payout preference after approval (peer verify or Trusted auto-approve). merits converts
            the Chron grant to Merits (A6); chrons keeps Chrons. Same semantics as Civic civic_create_work_report.
            On same-day merges into one WR, merits is sticky (any merits session wins for the whole node,
            including later Chron top-ups). Omitted or invalid → chrons.
          example: merits
    NewWReportResponse:
      type: object
      properties:
        created_wr_nid:
          type: integer
          description: 'A greater than 0 new work report ID, value 0 indicates the report is unpublished
            and no verifiers were invited; Error values: -1: author of the report is not a shareholder
            of the parent project; -2: the date_started is earlier that the date when the author registered
            in Rovas; -3: the report-filing author has more than one pending verification slot, so no
            verifiers were invited to verify the report; -4: date_started is more than 30 days before
            now;'
          example: 19008
    DeleteWorkReport:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: ID of the report
          format: int64
          example: 123
    DeleteWorkReportResponse:
      type: object
      properties:
        result:
          type: integer
          description: 'returns: ''1'' if report deleted succesfully, ''-1'' not deleted - author of the
            report is different from the one making the call, or can not be deleted for other reason'
          enum:
          - 1
          - -1
          example: 1
    WorkReportVerifiability:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: Rovas work report ID
          format: int64
          example: 123
    VerifiabilityResponse:
      type: object
      properties:
        verifiable:
          type: boolean
          description: "* `1` - \"if report is verifiable by the user\" * `0` - \"if report is NOT verifiable\"\
            \ \n"
          enum:
          - 1
          - 0
          example: 1
        reason:
          type: integer
          description: |
            * `1` - "no problem found when checking" * `-1` - "the work report can not be found"
          enum:
          - 1
          - -1
          example: 1
    Editability:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: Rovas work report ID
          format: int64
          example: 123
    EditabilityResponse:
      type: object
      properties:
        result:
          type: integer
          description: |
            * `1` - "if report is editable by the user 0 if not editable" * `-1` - "if the work report can not be found"
          enum:
          - 1
          - -1
          example: 1
    CreateVerification:
      required:
      - wr_id
      - verdict
      type: object
      properties:
        wr_id:
          type: integer
          format: int64
          example: 123
        verdict:
          type: integer
          format: int32
          description: verification result; 0 - rejected, 1 - approved
          enum:
          - 0
          - 1
          example: 1
    VerificationResponse:
      type: object
      properties:
        verification_id:
          type: integer
          description: returns the new verification ID if succesfull, '-2' if the report can not be found,
            '-3' if the report is not verifiable by the user.
          example: 2930
    CreateVerificationAT:
      required:
      - access_token
      - uid
      - wr_id
      - verdict
      type: object
      properties:
        access_token:
          type: string
          description: access token of the verified work report
          example: 143ac8d45c7b8a6cc020
        uid:
          type: integer
          description: Rovas ID of the verifier
          example: 289
        wr_id:
          type: integer
          description: The verified work report ID
          format: int64
          example: 123
        verdict:
          type: integer
          format: int32
          description: verification result; 0 - rejected, 1 - approved
          example: 1
    VerificationATResponse:
      type: object
      properties:
        verification_id:
          type: integer
          format: int64
          description: Returns the verification node ID if successful, '-1' if user does not exist with
            the supplied ID, '-2' if the access token  supplied is invalid, '-3' if there does not exist
            a verification slip for the access token and UID, or the supplied work report ID does not
            match the report ID found from the access token
          example: 2930
    CreateAUR:
      required:
      - project_id
      - wr_id
      - usage_fee
      type: object
      properties:
        project_id:
          type: integer
          format: int64
          example: 123
          description: The beneficiary project ID
        wr_id:
          type: integer
          format: int64
          example: 123
          description: The ID of a work report that uses the product or service delivered by the beneficiary
            project
        usage_fee:
          type: string
          description: the fee paid by the work report creator for usage of the product or service described
            in the beneficiary project
          example: 9.23
        note:
          type: string
          description: an optional note
          example: 3% fee levied by the 'Obsidian hand axe' project for using the axe
    CreateAURResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          example: 49382
          description: 'success: an integer greater than 0 denoting the AUR ID. ''null'' is returned if
            entities do not exist for the supplied IDs, or the usage fee is empty; ''0'' if work report
            was not found for the supplied ID; ''-1'' if the work report owner is not the same as the
            user;'
    NewPurchase:
      required:
      - product_id
      - amount_paid
      - note
      type: object
      properties:
        product_id:
          type: integer
          description: Rovas product ID
          format: int64
          example: 123
        amount_paid:
          type: number
          format: float
          example: 2.3
        note:
          type: string
          description: Any note related to purchase
          example: Purchase made by <REST client app name> user
    PurchaseResponse:
      type: object
      properties:
        result:
          type: integer
          format: int32
          description: |
            * `1` - "for success" * `-1` - "the amount paid is negative or 0 (no purchase was made)" * `-2` - "no enough funds to buy the product" * `-3` - "product not found for the supplied ID"
          enum:
          - 1
          - -1
          - -2
          - -3
          example: 1
    WorkReportReward:
      required:
      - report_id
      - reward_amount
      - description
      type: object
      properties:
        report_id:
          type: integer
          description: Rovas work report ID
          format: int64
          example: 123
        reward_amount:
          type: number
          format: float
          example: 2.3
        description:
          type: string
          description: Any note related to the reward
          example: A work report reward made by <REST client app name> user
    WorkReportRewardResponse:
      type: object
      properties:
        result:
          type: integer
          format: int32
          description: |
            * `1` - "for success" * `0` - "for failure"
          example: 0
        result_explain:
          type: string
          description: the reason of failure in plain english
          example: The object ID supplied does not belong to a work report
    UsersChronsResponse:
      type: object
      properties:
        total_chrons:
          type: number
          description: The total Chrons balance.
          format: float
          example: 2.3
        chrons_available:
          type: number
          description: The total Chrons balance minus all commitments to pay
          format: float
          example: 1.7
    FetchUserDataResponse:
      type: object
      properties:
        country:
          type: string
          description: 2-letter ISO country code in all caps
          example: DE
        uid:
          type: integer
          description: User ID
          format: int32
          example: 1
        username:
          type: string
          description: User name
          example: smartuser
        lang_code:
          type: string
          description: Two letter language code
          example: sk
        email:
          type: string
          description: Email
          example: smart.user@rovas.app
        comp_score:
          type: integer
          description: Compliance score
          format: int32
          example: 1
        whole_name:
          type: string
          description: Full name if available. Might be 'nomen omen' for users wo did not set their full
            name.
          example: Smart User
    UsersMerits:
      required:
      - nace_id
      type: object
      nullable: true
      properties:
        nace_id:
          $ref: '#/components/schemas/RovasTerms'
    UsersMeritsResponse:
      type: object
      properties:
        total_merits:
          type: number
          description: The total Merits balance.
          format: float
          example: 2.3
        term_merits:
          type: number
          description: The total Merit balance for the supplied term.
          format: float
          example: 1.7
    DeleteProject:
      required:
      - project_id
      type: object
      properties:
        project_id:
          type: integer
          description: ID of the project
          format: int64
          example: 123
    DeleteProjectResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          description: |
            * `1` - "success"  * `0` - "failure" * `null` - "returned if the API KEY and TOKEN supplied in the header do not belong to user with the 'api client' Rovas role "
          enum:
          - 0
          - 1
          - null
          example: 1
        result_explain:
          type: integer
          nullable: true
          format: int32
          description: |
            * `0` - "no error" * `1` - "deleting project not allowed" * `2` - "project not found for the given ID"
          enum:
          - 0
          - 1
          - 2
          example: 0
    GetVerifStatus:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: Work report ID
          format: int64
          example: 123
    GetVerifStatusResponse:
      type: object
      properties:
        result:
          type: integer
          description: |
            * `0` - "0 approvals" * `-1` - "one approval" * `1` - "more than one approval" * `-3` - "work report can not be found with the supplied ID"
          format: int32
          enum:
          - 0
          - -1
          - 1
          - -3
          - -4
          - -5
          example: 1
        count_total:
          type: integer
          description: the number of verifications made for the work report; a negative number indicates
            an error during processing of the request, explained by the 'result' parameter;
          enum:
          - -1
          - 0
          - 1
          - 2
          - 3
          example: 0
    RetrieveNodeResponse:
      type: object
      required:
      - nid
      - type
      - title
      - status
      - uid
      - url
      properties:
        nid:
          type: integer
          example: 2410
        type:
          type: string
          enum:
          - project
          - work_report
          - charity_organization
          - dispute
          example: project
        title:
          type: string
          example: Trail maintenance
        status:
          type: integer
          description: 1 = published, 0 = unpublished
          example: 1
        uid:
          type: integer
          description: Author Drupal uid
          example: 42
        created:
          type: string
          format: date-time
          nullable: true
          example: '2019-03-12T14:22:01+00:00'
        changed:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-08T09:15:00+00:00'
        language:
          type: string
          nullable: true
          description: Drupal langcode; null when empty or und
          example: sk
        url:
          type: string
          format: uri
          example: https://rovas.app/node/2410
        is_public:
          type: boolean
          description: Present for type=project (participation Public or Public-dependent)
          example: true
        project_nid:
          type: integer
          nullable: true
          description: Present for type=work_report; linked project nid when set
          example: 2410
    UpdateNode:
      type: object
      required:
      - field_hours_worked
      description: the field to be updated
      properties:
        field_hours_worked:
          $ref: '#/components/schemas/UndSchema'
    UndSchema:
      type: object
      required:
      - und
      description: language of the field. 'und' stands for not specified
      properties:
        und:
          $ref: '#/components/schemas/valueArray'
    valueArray:
      type: array
      description: this is a single-value field, so there is only one member in this array
      items:
        $ref: '#/components/schemas/valueItem'
    valueItem:
      type: object
      required:
      - value
      properties:
        value:
          $ref: '#/components/schemas/ValueSchema'
    ValueSchema:
      type: number
      description: The number of hours in decimal form
      format: decimal
      example: 12.3
    UpdateNodeResponse:
      type: object
      properties:
        nid:
          type: integer
          description: node ID of the updated node
          example: 1838
        uri:
          type: string
          description: URL of the updated node
          example: https://dev.rovas.app/rovas/node/2413
    ProjectMerits:
      required:
      - project_ids
      type: object
      properties:
        project_ids:
          type: string
          description: pipe separated project IDs
          example: 2410|2421
    ProjectMeritsResponse:
      type: object
      properties:
        project_merits:
          type: string
          description: 'json-encoded string containig rovas project IDs and their current merit rating.
            Error states: ''-1'' - the supplied IDs are in an incorrect format; empty set is returned
            if no projects were found for the supplied IDs'
          example: 'project_merits: ''[{"nid":"23842","merits":"0.6000000000"},{"nid":"23891","merits":"0.0000000000"}]'''
    CheckAddShareholder:
      required:
      - project_id
      type: object
      properties:
        project_id:
          type: integer
          format: int64
          example: 838938
    CheckAddShareholResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          description: returns a Worker Merit Allocation node ID if the user is a shareholder, '0' if
            project is private and user can not add themselves, '-1' if project does not exist
          example: 87226
    CheckAddProjectShareholder:
      required:
      - project_nid
      - shareholder_proj_nid
      - time_based
      - merit_share
      type: object
      properties:
        project_nid:
          type: integer
          format: int64
          description: project ID
          example: 838938
        shareholder_proj_nid:
          type: integer
          format: int64
          description: shareholder project ID
          example: 838938
        time_based:
          type: integer
          format: int64
          description: 1 - time-based; 0 - percent-based
          enum:
          - 1
          - 0
          example: 1
        merit_share:
          type: number
          format: float
          description: the desired merit share in %
          example: '3.14159'
    CheckAddProjectShareholResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          description: returns the Project Merit Allocation node ID for the shareholder project, '-1'
            if the project author is not the API and Token owner, '-2' if a project does not exist with
            the project_nid given, '-3' if a project does not exist with the shareholder_proj_nid given,
            '-4' if the project shareholder being added isn already a shareholder, or the total shares
            exceeds 100 for non-time-based shareholder
          example: 87226
    ConvertChrons:
      required:
      - euros
      type: object
      properties:
        euros:
          type: number
          format: float
          description: The Euro amount
          example: '3.14159'
    ConvertChronsResponse:
      type: object
      properties:
        chrons:
          type: number
          format: float
          description: The amount of Chrons converted to Euros. Negative values are made positive and
            subsequently converted.
          example: '234.98'
    CheckVerifAccessTokens:
      required:
      - access_token
      - uid
      type: object
      properties:
        access_token:
          type: string
          description: access token of the verified report
          example: 143ac8d45c7b8a6ac054
        uid:
          type: integer
          description: Verifier Rovas user ID
          example: 289
    CheckVerifAccessTokensResponse:
      type: object
      properties:
        verify_allow:
          type: integer
          format: int32
          description: |
            * `1` - "user can verify the content" * `0` - "user can not verify the content"
          enum:
          - 1
          - 0
          example: 1
    CheckEnabledLang:
      required:
      - input
      type: object
      properties:
        input:
          type: string
          description: two-letter language code in lower case
          example: sk
    CheckEnabledLangResponse:
      type: object
      properties:
        output:
          type: integer
          description: |
            * `0` - "language is enabled" * `1` - "language is not enabled"
          enum:
          - 0
          - 1
          example: 1
