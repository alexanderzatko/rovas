    VerificationItem:
      type: object
      properties:
        report_nid:
          type: string
          example: '429357'
        report_title:
          type: string
          example: Creating map data with JOSM
        verify_date:
          type: string
          description: UNIX timestamp (seconds)
          example: '1753086074'
        verify_date_formatted:
          type: string
          example: Mon, 07/21/2025 - 10:21
        report_url:
          type: string
          format: uri
          example: https://dev.rovas.app/node/429357
    VerificationsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
          example: 41
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/VerificationItem'
    CommentNoticeItem:
      type: object
      properties:
        nid:
          type: integer
          description: Node ID the comment belongs to
          example: 123
        node_title:
          type: string
          example: Example post
        cid:
          type: integer
          description: Comment ID that triggered the notice
          example: 456
        comment_url:
          type: string
          format: uri
          description: Absolute comment permalink
          example: https://dev.rovas.app/comment/456
        created:
          type: integer
          description: UNIX timestamp when the notice was created
          example: 1729100000
    CommentNoticesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
          example: 1
        notices:
          type: array
          items:
            $ref: '#/components/schemas/CommentNoticeItem'
    RulesCreateUserRequest:
      type: object
      required:
      - user_name
      - user_id
      - user_email
      - user_country
      - user_language
      - server_url
      properties:
        user_name:
          type: string
          description: Display name for the new or linked Rovas user.
          example: Jane Partner User
        user_id:
          type: integer
          description: External user id at the partner (HybridAuth provider_identifier).
          example: 12345
        user_email:
          type: string
          format: email
          description: Used to find an existing Rovas account by mail.
        user_country:
          type: string
          description: |
            ISO 3166-1 alpha-2 code (e.g. SK). The `rovas_partner_user` endpoint requires **uppercase**
            ASCII letters only; the legacy Rules endpoint did not enforce casing.
        user_language:
          type: string
          description: Language code; rule maps sk/cs to sk, default en.
          example: en
        server_url:
          type: string
          format: uri
          description: Partner base URL for HybridAuth profile link (e.g. trailing slash optional per client).
          example: https://partner.example/
        hybridauth_provider:
          type: string
          nullable: true
          description: |
            HybridAuth provider machine name (e.g. Nabezky). Omit or empty for default Nabezky.
            Must be enabled on the site; use GET rovas_hybridauth_providers to list options.
        partner_client_id:
          type: string
          nullable: true
          description: Optional metadata stored on the user (`rovas_partner_client_id`).
    RulesCreateUserResponse:
      type: object
      properties:
        rovas_uid:
          type: integer
          description: Rovas user id (new or existing).
        api_key:
          type: string
          description: API key for `rovas_endpoint` for that user.
        token:
          type: string
          description: Token for `rovas_endpoint` for that user.
    HybridAuthProviderItem:
      type: object
      properties:
        id:
          type: string
          description: Provider machine name; use as `hybridauth_provider` in rules_create_user.
        name:
          type: string
          description: Display label for UI.
    HybridAuthProvidersResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        providers:
          type: array
          items:
            $ref: '#/components/schemas/HybridAuthProviderItem'
