openapi: 3.0.1
info:
  title: Rovas API
  description: ''
  termsOfService: https://rovas.app/terms/
  contact:
    email: info@neofund.sk
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Information about Rovas and NEO
  url: https://rovas.app/
servers:
- url: https://dev.rovas.app/
- url: https://rovas.app/
paths:
  /rovas/node/{id}:
    get:
      tags:
      - base
      summary: Retrieve basic fields for an allowlisted node type
      description: |
        Returns a sanitized payload for types `project`, `work_report`,
        `charity_organization`, or `dispute` only. Other types (and missing
        nids) return 404. Does not dump the full Drupal node object.
        Project responses include `is_public`; work_report responses include
        `project_nid` when set.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      - in: path
        name: id
        required: true
        description: the node ID
        schema:
          type: integer
          example: 2410
      responses:
        '200':
          description: Sanitized node summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveNodeResponse'
        '401':
          description: Missing or invalid API-KEY / TOKEN
        '403':
          description: Authenticated but not allowed to view the node
        '404':
          description: Missing nid or type not in the allowlist
    put:
      tags:
      - base
      summary: Updates a node owned by the user whose credentials are supplied in
        the header
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      - in: path
        name: id
        required: true
        description: the node ID
        schema:
          type: integer
          example: 232
      requestBody:
        description: Updates a node with an ID given in the URL paramater.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNode'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateNode'
        required: true
      responses:
        '200':
          description: If succesfull returns the node ID and URL of the updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNodeResponse'
    delete:
      tags:
      - base
      summary: Deletes a node owned by the user whose credentials are supplied in
        the header
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      - in: path
        name: id
        required: true
        description: the node ID
        schema:
          type: integer
          example: 232
      responses:
        '200':
          description: If succesfull returns the boolean TRUE.
  /rovas/rules/rules_proxy_create_new_project:
    post:
      tags:
      - rule
      summary: Create a project
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: Once a project is created, Rovas automatically creates also a
          new merit allocation document for the project owner.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewProject'
        required: true
      responses:
        '200':
          description: returns project/node ID of the created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewProjectResponse'
  /rovas/rules/rules_proxy_create_work_report:
    post:
      tags:
      - rule
      summary: Create a work report in Rovas.
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: Only the Web URL is supported as work evidence.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkReport'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewWorkReport'
        required: true
      responses:
        '200':
          description: returns the new work report node ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewWReportResponse'
  /rovas/rules/rules_proxy_delete_work_report:
    post:
      tags:
      - rule
      summary: Delete a work report
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: If allowed, deletes a work report. Only own reports are deletable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkReport'
          application/xml:
            schema:
              $ref: '#/components/schemas/DeleteWorkReport'
        required: true
      responses:
        '200':
          description: Returns 1 if deleted succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkReportResponse'
  /rovas/rules/rules_proxy_work_report_verifiability:
    post:
      tags:
      - rule
      summary: Finds out if work report is verifiable by an user
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: The call finds out if report is verifiable and sets an environmental
          variable in Rovas that locks one of two/three verifiacation slots for 10
          minutes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkReportVerifiability'
          application/xml:
            schema:
              $ref: '#/components/schemas/WorkReportVerifiability'
        required: true
      responses:
        '200':
          description: returns 1 or 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiabilityResponse'
  /rovas/rules/rules_proxy_report_editability:
    post:
      tags:
      - rule
      summary: Finds out if work report is editable by an user
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: The call determines if a report can be edited by the user identified
          by the API key and the token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Editability'
          application/xml:
            schema:
              $ref: '#/components/schemas/Editability'
        required: true
      responses:
        '200':
          description: returns 1 or 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditabilityResponse'
  /rovas/rules/rules_create_user:
    post:
      tags:
      - rule
      summary: Create or link a Rovas user (third-party integration)
      description: |
        For partner backends using an **api client** Rovas account: creates a new user or links
        HybridAuth identity when the email already exists. Requires permission
        `access services_rules rules_create_user` (api client / administrator roles).
        JSON keys match Rules variables; optional `hybridauth_provider` defaults to Nabezky if empty.
        Use GET `/rovas/rovas_hybridauth_providers.json` to list valid provider ids.
      parameters:
      - in: header
        name: API-KEY
        description: API key for `rovas_endpoint` (api client technical account).
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: Token for `rovas_endpoint` (api client technical account).
        schema:
          type: string
        required: true
      requestBody:
        description: Rule parameters (see rovas_site_rules README).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
        required: true
      responses:
        '200':
          description: Rovas user id and `rovas_endpoint` API credentials for that user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
        '401':
          description: Missing or invalid API credentials.
        '403':
          description: Caller lacks permission to invoke this rule.
  /rovas/rovas_partner_user:
    post:
      tags:
      - rovas
      summary: Create or link a Rovas user (partner API, replaces rules_create_user)
      description: |
        Same purpose as `POST /rovas/rules/rules_create_user`, implemented as a native Services resource
        for stricter validation and easier evolution. Requires permission
        `access services_rules rules_create_user` and the same API client headers as other `rovas_endpoint` calls.
        **user_country** must be two **uppercase** ASCII letters (ISO 3166-1 alpha-2) and must exist in the
        site country list. **user_language** is normalized to an **enabled** Drupal interface language
        (`rovas_base_map_partner_user_language`). Request body schema matches **RulesCreateUserRequest**.
      parameters:
      - in: header
        name: API-KEY
        description: API key for `rovas_endpoint` (api client technical account).
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: Token for `rovas_endpoint` (api client technical account).
        schema:
          type: string
        required: true
      requestBody:
        description: Same fields as rules_create_user (see RulesCreateUserRequest).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
        required: true
      responses:
        '200':
          description: Rovas user id and `rovas_endpoint` API credentials for that user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
        '400':
          description: Validation error (country code, language, URL, email, provider, etc.).
        '401':
          description: Missing or invalid API credentials.
        '403':
          description: Caller lacks permission.
        '500':
          description: Server or registration failure.
  /rovas/rules/rules_create_verification:
    post:
      tags:
      - rule
      summary: Create a verification record
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: Creates a verification record for the work report.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerification'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateVerification'
        required: true
      responses:
        '200':
          description: returns verification record ID if successful, -1 otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
  /rovas/rules/rules_proxy_create_aur:
    post:
      tags:
      - rule
      summary: Create an asset usage record, to charge a fee to an user for using
        somebody else's product
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: Creates an asset usage record.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAUR'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateAUR'
        required: true
      responses:
        '200':
          description: returns AUR record ID if successful, 0 or -1 otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAURResponse'
  /rovas/rules/rules_create_verification_with_acccess_token:
    post:
      tags:
      - rule
      summary: Create a verification record
      requestBody:
        description: Creates a verification record for the work report using access
          token and Rovas user ID. No API-KEY and TOKEN are needed in header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationAT'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateVerificationAT'
        required: true
      responses:
        '200':
          description: returns verification record ID if successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationATResponse'
  /rovas/rules/rules_proxy_purchase_product:
    post:
      tags:
      - rule
      summary: Process purchase of a product.
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: Creates purchase receipts, processes Chron transactions, distributes
          Merits to shareholders and (optionally Chrons to the project owner).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPurchase'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewPurchase'
        required: true
      responses:
        '200':
          description: returns an integer indicating the operation outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
  /rovas/rules/rules_proxy_reward_work_report:
    post:
      tags:
      - rule
      summary: Reward a work report
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: Rewards a work repor with merits equal to the chrons sent by
          the user identified by the API key and token sent in the header
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkReportReward'
          application/xml:
            schema:
              $ref: '#/components/schemas/WorkReportReward'
        required: true
      responses:
        '200':
          description: returns one of 0 or 1 as well as text explaining the ourcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkReportRewardResponse'
  /rovas/rules/rules_users_chrons:
    post:
      tags:
      - rule
      summary: Retrieves user's Chron balances.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      responses:
        '200':
          description: If succesfull, returns the total and available user's chron
            balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersChronsResponse'
  /rovas/rules/rules_fetch_user_data:
    post:
      tags:
      - rule
      summary: Retrieves user's Rovas profile info.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      responses:
        '200':
          description: If succesfull, returns information from the user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUserDataResponse'
  /rovas/rules/rules_user_s_merits:
    post:
      tags:
      - rule
      summary: Retrieves user's total and taxonomy category-specific Merit balances.
        Set the nace_id param to 0 to return all Merits from the user's work reports.
        Retrieval error is indicated by value -1000000000.0000001 for either of the
        result parameters. Note that total_merits might differ from the term_merits
        when nace_id = 0 is passed to the endpoint.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      requestBody:
        description: use Rovas NACE term ID as a parameter
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersMerits'
          application/xml:
            schema:
              $ref: '#/components/schemas/UsersMerits'
        required: true
      responses:
        '200':
          description: returns total and taxonomy-category-specific Merit balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeritsResponse'
  /rovas/rules/rules_proxy_delete_project:
    post:
      tags:
      - rule
      summary: Delete a project
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      requestBody:
        description: Deletes a project and all related work reports, merit allocation
          shares and disputes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProject'
          application/xml:
            schema:
              $ref: '#/components/schemas/DeleteProject'
        required: true
      responses:
        '200':
          description: the 'result' parameter indicates the status of the operation
            - 0 for failure or 1 for success. The 'result_explain' parameter informs
            about the reason for failure if the project was not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectResponse'
  /rovas/rules/rules_proxy_report_verification_status:
    post:
      tags:
      - rule
      summary: Get a work report verification status
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      requestBody:
        description: Returns a count of verifications made and an integer indicating
          the number of approved verifications.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetVerifStatus'
          application/xml:
            schema:
              $ref: '#/components/schemas/GetVerifStatus'
        required: true
      responses:
        '200':
          description: the count_total shows the number of verifications and the result
            parameter encodes the number of approved ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVerifStatusResponse'
  /rovas/rules/rules_get_merits_for_projects:
    post:
      tags:
      - rule
      summary: Takes a list of Rovas project IDs separated by pipe and returns current
        merit value for each of the projects.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMerits'
          application/xml:
            schema:
              $ref: '#/components/schemas/ProjectMerits'
        required: true
      responses:
        '200':
          description: returns a json-encoded string of project IDs and their merits;
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMeritsResponse'
  /rovas/rules/rules_convert_euros_to_chrons:
    post:
      tags:
      - rule
      summary: Returns the amount of Chrons one can buy with the given Euros.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
          application/xml:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
        required: true
      responses:
        '200':
          description: returns a decimal representing the Chron amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertChronsResponse'
  /rovas/rules/rules_convert_euros_to_chrons_reverse:
    post:
      tags:
      - rule
      summary: Returns the amount of Chrons one has to pay to receive the given Euros.
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
          application/xml:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
        required: true
      responses:
        '200':
          description: returns a decimal representing the Chron amount, or -1 if user
            not found, or -2 if the euro amount exceeds the number of Euros available
            for exchange in Rovas;
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertChronsResponse'
  /rovas/rules/rules_proxy_check_verifier_by_access_tokens:
    post:
      tags:
      - rule
      summary: given access token and verifier ID, determines verifiability of a work
        report
      requestBody:
        description: Returns TRUE if a verification slip exists for the tokens supplied
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckVerifAccessTokens'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckVerifAccessTokens'
        required: true
      responses:
        '200':
          description: returns 1 if user can verify the content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckVerifAccessTokensResponse'
  /rovas/rules/rules_proxy_check_or_add_shareholder:
    post:
      tags:
      - rule
      summary: Checks that user is shareholder in a project. If not and possible,
        makes the user a shareholder.
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAddShareholder'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckAddShareholder'
        required: true
      responses:
        '200':
          description: returns the Merit allocation node ID if successfull and 0 or
            negative integer otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAddShareholResponse'
  /rovas/rules/rules_proxy_check_or_add_project_shareholder:
    post:
      tags:
      - rule
      summary: Checks that a project is a shareholder in a project. If not and possible,
        creates time, or percentage-based share.
      parameters:
      - in: header
        name: API-KEY
        description: The project owner API key
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: The project owner token
        schema:
          type: string
        required: true
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAddProjectShareholder'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckAddProjectShareholder'
        required: true
      responses:
        '200':
          description: returns the Merit allocation node ID if successfull and a negative
            integer otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAddProjectShareholResponse'
  /rovas/rules/rules_check_enabled_language:
    post:
      tags:
      - rule
      summary: Checks that a language identified by its 2-letter code is enabled
      parameters:
      - in: header
        name: API-KEY
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      - in: header
        name: TOKEN
        description: From the user profile in Rovas.
        schema:
          type: string
        required: true
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEnabledLang'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckEnabledLang'
        required: true
      responses:
        '200':
          description: returns a 1 if the specified language is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckEnabledLangResponse'
  /rovas/views/top_10_workers_in_a_category:
    get:
      summary: Get top x workers in a given category.
      tags:
      - views
      responses:
        '200':
          description: json encoded array
          content:
            application/json:
              schema:
                type: string
                example: '[{"rank":"1","rovas_uid":"289","merits":"19.20"},{"rank":"2","rovas_uid":"347","merits":"15.35"},{"rank":"3","rovas_uid":"520","merits":"14.13"}]'
    parameters:
    - name: display_id
      in: query
      description: the view display ID.
      required: true
      schema:
        type: string
        enum:
        - services_1
        example: services_1
    - name: filters[tid_raw]
      in: query
      description: Rovas category node ID
      required: false
      schema:
        $ref: '#/components/schemas/RovasTerms'
      example: 1794
    - name: filters[field_web_address_value]
      in: query
      description: The work report source url
      required: false
      schema:
        type: string
      example: nabezky.sk
    - name: limit
      in: query
      description: the number of records to be returned. If omitted, 10 records are
        returned
      required: false
      schema:
        type: integer
      example: 10
  /rovas/views/project_merits_feed:
    get:
      summary: Get top x users, who rewarded a project
      tags:
      - views
      responses:
        '200':
          description: json encoded array of Rovas user ID, user name and the merits
            earned
          content:
            application/json:
              schema:
                type: string
                example: '[{"rovas_uid":"111","name":"machyeior","merits":"0.18"},{"rovas_uid":"1111","name":"K\u00edt\u011bzslav
                  Huenfky","merits":"0.14"},{"rovas_uid":"2222","name":"heiodnkaoecny","merits":"0.11"}]'
    parameters:
    - name: display_id
      in: query
      description: the view display ID.
      required: true
      schema:
        type: string
        enum:
        - services_1
        example: services_1
    - name: filters[project_id]
      in: query
      description: Rovas project ID
      required: true
      schema:
        type: integer
      example: 12900
    - name: limit
      in: query
      description: the number of records to be returned. If omitted, 1 record is returned
      required: false
      schema:
        type: integer
      example: 10
  /rovas/views/projects_merits:
    get:
      summary: Get top x users, for projects from the same web site
      tags:
      - views
      responses:
        '200':
          description: 'json encoded array of: rank in the hierarchy, Rovas user ID,
            merit score for the user and the number of projects that share the same
            field_asset_web_address_value'
          content:
            application/json:
              schema:
                type: string
                example: '[{"rank": "1","rovas_uid": "289","merits": "131.65","count":
                  "65"},{"rank": "2","rovas_uid": "896",  "merits": "115.48","count":
                  "48"},{"rank": "3","rovas_uid": "520","merits": "91.94","count":
                  "56"}]'
    parameters:
    - name: display_id
      in: query
      description: the view display ID.
      required: true
      schema:
        type: string
        enum:
        - services
        example: services_1
    - name: filters[field_asset_web_address_value]
      in: query
      description: a part of the url the project refers to
      required: true
      schema:
        type: string
      example: nabezky.sk/node/
    - name: limit
      in: query
      description: the number of records to be returned.
      required: false
      schema:
        type: integer
      example: 10
  /rovas/rovas_verifications.json:
    get:
      summary: Get list of work report verifications
      tags:
      - custom
      responses:
        '200':
          description: JSON encoded array of verifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationsResponse'
              example:
                status: success
                count: 41
                verifications:
                - report_nid: '429357'
                  report_title: Creating map data with JOSM
                  verify_date: '1753086074'
                  verify_date_formatted: Mon, 07/21/2025 - 10:21
                  report_url: https://dev.rovas.app/node/429357
                - report_nid: '429454'
                  report_title: Creating map data with JOSM
                  verify_date: '1753086073'
                  verify_date_formatted: Mon, 07/21/2025 - 10:21
                  report_url: https://dev.rovas.app/node/429454
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
        example: vp5OvoSXloq64ksKmwvvtzc2zElJO0uM2MbsDFUYd4o
        description: From the user profile in Rovas.
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
        example: 9Lk438dmJJgsmrnhMHBtOCYYO_5DhkesoRXgfjMQmMIXq0
        description: From the user profile in Rovas.
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
        description: Expected response format.
      - in: header
        name: Content-Type
        schema:
          type: string
        required: false
        example: application/json
        description: Content type of the request.
  /rovas/rovas_comment_notices.json:
    get:
      summary: Get pending watched-comment notices
      description: |
        Pending in-app/API notices for new comments on nodes the key owner is watching
        (same Comment Notify audience as follow-up email). Poll-based; not an outbound
        webhook. Twin of Bearer `GET /rovas/civic_pending_comment_notices` (different
        response envelope). Requires module `rovas_comment_watch`. Path is
        `/rovas/rovas_comment_notices` (not under `/rovas/rules/`).
      tags:
      - custom
      responses:
        '200':
          description: JSON list of pending comment notices for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentNoticesResponse'
              example:
                status: success
                count: 1
                notices:
                - nid: 123
                  node_title: Example post
                  cid: 456
                  comment_url: https://dev.rovas.app/comment/456
                  created: 1729100000
        '401':
          description: Missing or invalid API-KEY / TOKEN
        '500':
          description: Comment watch module unavailable or query failure
      parameters:
      - in: header
        name: API-KEY
        schema:
          type: string
        required: true
        example: vp5OvoSXloq64ksKmwvvtzc2zElJO0uM2MbsDFUYd4o
        description: From the user profile in Rovas.
      - in: header
        name: TOKEN
        schema:
          type: string
        required: true
        example: 9Lk438dmJJgsmrnhMHBtOCYYO_5DhkesoRXgfjMQmMIXq0
        description: From the user profile in Rovas.
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
        description: Expected response format.
  /rovas/rovas_hybridauth_providers.json:
    get:
      tags:
      - custom
      summary: List HybridAuth providers for account linking
      description: |
        Public endpoint: no `API-KEY` or `TOKEN` headers. Returns provider machine names
        enabled in HybridAuth—the same values allowed as `hybridauth_provider` in
        `rules_create_user`. The Services endpoint must have **Disable API keys authentication**
        enabled for this resource operation (`rovas_endpoint` → Resources →
        `rovas_hybridauth_providers` → index).
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
      responses:
        '200':
          description: Enabled providers for UI picker and for `rules_create_user.hybridauth_provider`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HybridAuthProvidersResponse'
              example:
                status: success
                providers:
                - id: Nabezky
                  name: Nabezky
components:
  schemas:
    NewProject:
      required:
      - project_name
      - project_status
      - project_participation
      type: object
      properties:
        project_name:
          type: string
          example: Test project title
        project_url:
          type: string
          example: https://nabezky.sk/node/388383
        project_price:
          type: number
          format: float
          example: 2.3
        project_status:
          type: integer
          description: 0 unfinished, 1 for sale, 2 sold, 3 expired
          enum:
          - 0
          - 1
          - 2
          - 3
        project_participation:
          type: integer
          description: 0 - Private, 1 - Public, 2 - Public - dependent on parent project
          enum:
          - 0
          - 1
          - 2
        project_description:
          type: string
          example: Report from a ski trip
    NewProjectResponse:
      type: object
      properties:
        created_project_nid:
          type: integer
          description: A greater than 0 new project ID.
          example: 19928
    NewWorkReport:
      description: ''
      required:
      - wr_classification
      - wr_activity_name
      - wr_hours
      - wr_web_address
      - date_started
      - publish_status
      - parent_project_nid
      type: object
      properties:
        wr_classification:
          $ref: '#/components/schemas/RovasTerms'
        wr_description:
          type: string
          description: accepts HTML tags
          example: Moved a big rock up the hill, but it fell back. Will continue rolling
            tomorrow.
        wr_activity_name:
          type: string
          description: title of work report - activity summary
          example: Rock moving
        wr_hours:
          type: number
          format: float
          description: time in hours
          example: 2.5
        wr_web_address:
          type: string
          description: URL of a proof for the work performed
          example: https://nabezky.sk/node/3883
        parent_project_nid:
          type: integer
          format: int64
          description: parent project node ID
          example: 28388348
        date_started:
          type: integer
          format: int64
          description: the date and time in UNIX timestamp format; must be within the
            last 30 days
          example: 1594538979
        access_token:
          type: string
          description: A text string of sufficient length and complexity that - when
            presented as URL argument 'cbt' attached to the address in the wr_web_address
            field - will allow unauthenticated access to the proof of work in that
            web page
          example: 7JH_hdjd83%ks
        publish_status:
          type: integer
          format: int64
          description: if greater than 0, the report will be published; unpublished
            otherwise. No verifiers are invited for unpublished reports
          example: 1
    NewWReportResponse:
      type: object
      properties:
        created_wr_nid:
          type: integer
          description: 'A greater than 0 new work report ID, value 0 indicates the
            report is unpublished and no verifiers were invited; Error values: -1:
            author of the report is not a shareholder of the parent project; -2: the
            date_started is earlier that the date when the author registered in Rovas;
            -3: the report-filing author has more than one pending verification slot,
            so no verifiers were invited to verify the report; -4: date_started is
            more than 30 days before now;'
          example: 19008
    DeleteWorkReport:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: ID of the report
          format: int64
          example: 123
    DeleteWorkReportResponse:
      type: object
      properties:
        result:
          type: integer
          description: 'returns: ''1'' if report deleted succesfully, ''-1'' not deleted
            - author of the report is different from the one making the call, or can
            not be deleted for other reason'
          enum:
          - 1
          - -1
          example: 1
    WorkReportVerifiability:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: Rovas work report ID
          format: int64
          example: 123
    VerifiabilityResponse:
      type: object
      properties:
        verifiable:
          type: boolean
          description: "* `1` - \"if report is verifiable by the user\" * `0` - \"\
            if report is NOT verifiable\" \n"
          enum:
          - 1
          - 0
          example: 1
        reason:
          type: integer
          description: '* `1` - "no problem found when checking" * `-1` - "the work
            report can not be found"

            '
          enum:
          - 1
          - -1
          example: 1
    Editability:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: Rovas work report ID
          format: int64
          example: 123
    EditabilityResponse:
      type: object
      properties:
        result:
          type: integer
          description: '* `1` - "if report is editable by the user 0 if not editable"
            * `-1` - "if the work report can not be found"

            '
          enum:
          - 1
          - -1
          example: 1
    CreateVerification:
      required:
      - wr_id
      - verdict
      type: object
      properties:
        wr_id:
          type: integer
          format: int64
          example: 123
        verdict:
          type: integer
          format: int32
          description: verification result; 0 - rejected, 1 - approved
          enum:
          - 0
          - 1
          example: 1
    VerificationResponse:
      type: object
      properties:
        verification_id:
          type: integer
          description: returns the new verification ID if succesfull, '-2' if the
            report can not be found, '-3' if the report is not verifiable by the user.
          example: 2930
    CreateVerificationAT:
      required:
      - access_token
      - uid
      - wr_id
      - verdict
      type: object
      properties:
        access_token:
          type: string
          description: access token of the verified work report
          example: 143ac8d45c7b8a6cc020
        uid:
          type: integer
          description: Rovas ID of the verifier
          example: 289
        wr_id:
          type: integer
          description: The verified work report ID
          format: int64
          example: 123
        verdict:
          type: integer
          format: int32
          description: verification result; 0 - rejected, 1 - approved
          example: 1
    VerificationATResponse:
      type: object
      properties:
        verification_id:
          type: integer
          format: int64
          description: Returns the verification node ID if successful, '-1' if user
            does not exist with the supplied ID, '-2' if the access token  supplied
            is invalid, '-3' if there does not exist a verification slip for the access
            token and UID, or the supplied work report ID does not match the report
            ID found from the access token
          example: 2930
    CreateAUR:
      required:
      - project_id
      - wr_id
      - usage_fee
      type: object
      properties:
        project_id:
          type: integer
          format: int64
          example: 123
          description: The beneficiary project ID
        wr_id:
          type: integer
          format: int64
          example: 123
          description: The ID of a work report that uses the product or service delivered
            by the beneficiary project
        usage_fee:
          type: string
          description: the fee paid by the work report creator for usage of the product
            or service described in the beneficiary project
          example: 9.23
        note:
          type: string
          description: an optional note
          example: 3% fee levied by the 'Obsidian hand axe' project for using the
            axe
    CreateAURResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          example: 49382
          description: 'success: an integer greater than 0 denoting the AUR ID. ''null''
            is returned if entities do not exist for the supplied IDs, or the usage
            fee is empty; ''0'' if work report was not found for the supplied ID;
            ''-1'' if the work report owner is not the same as the user;'
    NewPurchase:
      required:
      - product_id
      - amount_paid
      - note
      type: object
      properties:
        product_id:
          type: integer
          description: Rovas product ID
          format: int64
          example: 123
        amount_paid:
          type: number
          format: float
          example: 2.3
        note:
          type: string
          description: Any note related to purchase
          example: Purchase made by <REST client app name> user
    PurchaseResponse:
      type: object
      properties:
        result:
          type: integer
          format: int32
          description: '* `1` - "for success" * `-1` - "the amount paid is negative
            or 0 (no purchase was made)" * `-2` - "no enough funds to buy the product"
            * `-3` - "product not found for the supplied ID"

            '
          enum:
          - 1
          - -1
          - -2
          - -3
          example: 1
    WorkReportReward:
      required:
      - report_id
      - reward_amount
      - description
      type: object
      properties:
        report_id:
          type: integer
          description: Rovas work report ID
          format: int64
          example: 123
        reward_amount:
          type: number
          format: float
          example: 2.3
        description:
          type: string
          description: Any note related to the reward
          example: A work report reward made by <REST client app name> user
    WorkReportRewardResponse:
      type: object
      properties:
        result:
          type: integer
          format: int32
          description: '* `1` - "for success" * `0` - "for failure"

            '
          example: 0
        result_explain:
          type: string
          description: the reason of failure in plain english
          example: The object ID supplied does not belong to a work report
    UsersChronsResponse:
      type: object
      properties:
        total_chrons:
          type: number
          description: The total Chrons balance.
          format: float
          example: 2.3
        chrons_available:
          type: number
          description: The total Chrons balance minus all commitments to pay
          format: float
          example: 1.7
    FetchUserDataResponse:
      type: object
      properties:
        country:
          type: string
          description: 2-letter ISO country code in all caps
          example: DE
        uid:
          type: integer
          description: User ID
          format: int32
          example: 1
        username:
          type: string
          description: User name
          example: smartuser
        lang_code:
          type: string
          description: Two letter language code
          example: sk
        email:
          type: string
          description: Email
          example: smart.user@rovas.app
        comp_score:
          type: integer
          description: Compliance score
          format: int32
          example: 1
        whole_name:
          type: string
          description: Full name if available. Might be 'nomen omen' for users wo
            did not set their full name.
          example: Smart User
    UsersMerits:
      required:
      - nace_id
      type: object
      nullable: true
      properties:
        nace_id:
          $ref: '#/components/schemas/RovasTerms'
    UsersMeritsResponse:
      type: object
      properties:
        total_merits:
          type: number
          description: The total Merits balance.
          format: float
          example: 2.3
        term_merits:
          type: number
          description: The total Merit balance for the supplied term.
          format: float
          example: 1.7
    DeleteProject:
      required:
      - project_id
      type: object
      properties:
        project_id:
          type: integer
          description: ID of the project
          format: int64
          example: 123
    DeleteProjectResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          description: '* `1` - "success"  * `0` - "failure" * `null` - "returned
            if the API KEY and TOKEN supplied in the header do not belong to user
            with the ''api client'' Rovas role "

            '
          enum:
          - 0
          - 1
          - null
          example: 1
        result_explain:
          type: integer
          nullable: true
          format: int32
          description: '* `0` - "no error" * `1` - "deleting project not allowed"
            * `2` - "project not found for the given ID"

            '
          enum:
          - 0
          - 1
          - 2
          example: 0
    GetVerifStatus:
      required:
      - wr_id
      type: object
      properties:
        wr_id:
          type: integer
          description: Work report ID
          format: int64
          example: 123
    GetVerifStatusResponse:
      type: object
      properties:
        result:
          type: integer
          description: '* `0` - "0 approvals" * `-1` - "one approval" * `1` - "more
            than one approval" * `-3` - "work report can not be found with the supplied
            ID"

            '
          format: int32
          enum:
          - 0
          - -1
          - 1
          - -3
          - -4
          - -5
          example: 1
        count_total:
          type: integer
          description: the number of verifications made for the work report; a negative
            number indicates an error during processing of the request, explained
            by the 'result' parameter;
          enum:
          - -1
          - 0
          - 1
          - 2
          - 3
          example: 0
    RetrieveNodeResponse:
      type: object
      required:
      - nid
      - type
      - title
      - status
      - uid
      - url
      properties:
        nid:
          type: integer
          example: 2410
        type:
          type: string
          enum:
          - project
          - work_report
          - charity_organization
          - dispute
          example: project
        title:
          type: string
          example: Trail maintenance
        status:
          type: integer
          description: '1 = published, 0 = unpublished'
          example: 1
        uid:
          type: integer
          description: Author Drupal uid
          example: 42
        created:
          type: string
          format: date-time
          nullable: true
          example: '2019-03-12T14:22:01+00:00'
        changed:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-08T09:15:00+00:00'
        language:
          type: string
          nullable: true
          description: Drupal langcode; null when empty or und
          example: sk
        url:
          type: string
          format: uri
          example: https://rovas.app/node/2410
        is_public:
          type: boolean
          description: Present for type=project (participation Public or Public-dependent)
          example: true
        project_nid:
          type: integer
          nullable: true
          description: Present for type=work_report; linked project nid when set
          example: 2410
    UpdateNode:
      type: object
      required:
      - field_hours_worked
      description: the field to be updated
      properties:
        field_hours_worked:
          $ref: '#/components/schemas/UndSchema'
    UndSchema:
      type: object
      required:
      - und
      description: language of the field. 'und' stands for not specified
      properties:
        und:
          $ref: '#/components/schemas/valueArray'
    valueArray:
      type: array
      description: this is a single-value field, so there is only one member in this
        array
      items:
        $ref: '#/components/schemas/valueItem'
    valueItem:
      type: object
      required:
      - value
      properties:
        value:
          $ref: '#/components/schemas/ValueSchema'
    ValueSchema:
      type: number
      description: The number of hours in decimal form
      format: decimal
      example: 12.3
    UpdateNodeResponse:
      type: object
      properties:
        nid:
          type: integer
          description: node ID of the updated node
          example: 1838
        uri:
          type: string
          description: URL of the updated node
          example: https://dev.rovas.app/rovas/node/2413
    ProjectMerits:
      required:
      - project_ids
      type: object
      properties:
        project_ids:
          type: string
          description: pipe separated project IDs
          example: 2410|2421
    ProjectMeritsResponse:
      type: object
      properties:
        project_merits:
          type: string
          description: 'json-encoded string containig rovas project IDs and their
            current merit rating. Error states: ''-1'' - the supplied IDs are in an
            incorrect format; empty set is returned if no projects were found for
            the supplied IDs'
          example: 'project_merits: ''[{"nid":"23842","merits":"0.6000000000"},{"nid":"23891","merits":"0.0000000000"}]'''
    CheckAddShareholder:
      required:
      - project_id
      type: object
      properties:
        project_id:
          type: integer
          format: int64
          example: 838938
    CheckAddShareholResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          description: returns a Worker Merit Allocation node ID if the user is a
            shareholder, '0' if project is private and user can not add themselves,
            '-1' if project does not exist
          example: 87226
    CheckAddProjectShareholder:
      required:
      - project_nid
      - shareholder_proj_nid
      - time_based
      - merit_share
      type: object
      properties:
        project_nid:
          type: integer
          format: int64
          description: project ID
          example: 838938
        shareholder_proj_nid:
          type: integer
          format: int64
          description: shareholder project ID
          example: 838938
        time_based:
          type: integer
          format: int64
          description: 1 - time-based; 0 - percent-based
          enum:
          - 1
          - 0
          example: 1
        merit_share:
          type: number
          format: float
          description: the desired merit share in %
          example: '3.14159'
    CheckAddProjectShareholResponse:
      type: object
      properties:
        result:
          type: integer
          nullable: true
          format: int32
          description: returns the Project Merit Allocation node ID for the shareholder
            project, '-1' if the project author is not the API and Token owner, '-2'
            if a project does not exist with the project_nid given, '-3' if a project
            does not exist with the shareholder_proj_nid given, '-4' if the project
            shareholder being added isn already a shareholder, or the total shares
            exceeds 100 for non-time-based shareholder
          example: 87226
    ConvertChrons:
      required:
      - euros
      type: object
      properties:
        euros:
          type: number
          format: float
          description: The Euro amount
          example: '3.14159'
    ConvertChronsResponse:
      type: object
      properties:
        chrons:
          type: number
          format: float
          description: The amount of Chrons converted to Euros. Negative values are
            made positive and subsequently converted.
          example: '234.98'
    CheckVerifAccessTokens:
      required:
      - access_token
      - uid
      type: object
      properties:
        access_token:
          type: string
          description: access token of the verified report
          example: 143ac8d45c7b8a6ac054
        uid:
          type: integer
          description: Verifier Rovas user ID
          example: 289
    CheckVerifAccessTokensResponse:
      type: object
      properties:
        verify_allow:
          type: integer
          format: int32
          description: '* `1` - "user can verify the content" * `0` - "user can not
            verify the content"

            '
          enum:
          - 1
          - 0
          example: 1
    CheckEnabledLang:
      required:
      - input
      type: object
      properties:
        input:
          type: string
          description: two-letter language code in lower case
          example: sk
    CheckEnabledLangResponse:
      type: object
      properties:
        output:
          type: integer
          description: '* `0` - "language is enabled" * `1` - "language is not enabled"

            '
          enum:
          - 0
          - 1
          example: 1
