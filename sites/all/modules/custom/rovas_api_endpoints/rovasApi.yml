openapi: 3.0.1
info:
  title: Rovas API
  description: |
    Rovas REST API for partners, plugins, and apps (including NeoFund Civic).

    ## Environments

    | Environment | Base URL |
    | ----------- | -------- |
    | Production | `https://rovas.app` |
    | Development | `https://dev.rovas.app` |

    Service paths use the prefix `/rovas` (Drupal Services endpoint `rovas_endpoint`).
    OAuth protocol paths use `/oauth2`.

    Send `Accept: application/json` and, for POST/PUT bodies, `Content-Type: application/json`
    unless an operation notes otherwise (OAuth token exchange uses form body).

    ## Authentication models

    Do **not** mix models on one request.

    | Model | How | Best for |
    | ----- | --- | -------- |
    | Classic | Headers `API-KEY` + `TOKEN` | Partner backends, website plugins, server-to-server |
    | OAuth 2 (Bearer) | `Authorization: Bearer <access_token>` (scope `user_profile`) | Mobile / SPA with browser login (e.g. Civic) |
    | Public | No credentials (API-key auth disabled on the resource) | Catalogs, some leaderboards, HybridAuth provider list |

    Classic calls act as the owner of the API key pair. Bearer calls act as the
    OAuth-authenticated Drupal user. Civic-oriented resources have API-key auth
    disabled.

    Contact: info@neofund.sk — partner access and new OAuth clients are provisioned
    by NeoFund (do not reuse Civic's `client_id` from third-party apps).
  termsOfService: https://rovas.app/terms/
  contact:
    email: info@neofund.sk
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.1.0
externalDocs:
  description: Information about Rovas and NEO
  url: https://rovas.app/
servers:
- url: https://dev.rovas.app/
- url: https://rovas.app/
paths:
  /rovas/node/{id}:
    get:
      tags:
      - classic-nodes
      summary: Retrieve basic fields for an allowlisted node type
      description: |
        Returns a sanitized payload for types `project`, `work_report`,
        `charity_organization`, or `dispute` only. Other types (and missing
        nids) return 404. Does not dump the full Drupal node object.
        Project responses include `is_public`; work_report responses include
        `project_nid` when set.
      parameters:
      - in: path
        name: id
        required: true
        description: the node ID
        schema:
          type: integer
          example: 2410
      responses:
        '200':
          description: Sanitized node summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveNodeResponse'
        '401':
          description: Missing or invalid API-KEY / TOKEN
        '403':
          description: Authenticated but not allowed to view the node
        '404':
          description: Missing nid or type not in the allowlist
      security: &id001
      - ApiKeyAuth: []
        TokenAuth: []
    put:
      tags:
      - classic-nodes
      summary: Updates a node owned by the user whose credentials are supplied in the header
      parameters:
      - in: path
        name: id
        required: true
        description: the node ID
        schema:
          type: integer
          example: 232
      requestBody:
        description: Updates a node with an ID given in the URL paramater.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNode'
          application/xml:
            schema:
              $ref: '#/components/schemas/UpdateNode'
        required: true
      responses:
        '200':
          description: If succesfull returns the node ID and URL of the updated node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNodeResponse'
      security: *id001
    delete:
      tags:
      - classic-nodes
      summary: Deletes a node owned by the user whose credentials are supplied in the header
      parameters:
      - in: path
        name: id
        required: true
        description: the node ID
        schema:
          type: integer
          example: 232
      responses:
        '200':
          description: If succesfull returns the boolean TRUE.
      security: *id001
  /rovas/rules/rules_proxy_create_new_project:
    post:
      tags:
      - classic-projects
      summary: Create a project
      requestBody:
        description: Once a project is created, Rovas automatically creates also a new merit allocation
          document for the project owner.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewProject'
        required: true
      responses:
        '200':
          description: returns project/node ID of the created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewProjectResponse'
      security: *id001
  /rovas/rules/rules_proxy_create_work_report:
    post:
      tags:
      - classic-projects
      summary: Create a work report in Rovas. Optional reward_kind selects Merits vs Chrons after approval.
      requestBody:
        description: Only the Web URL is supported as work evidence. Optional reward_kind (merits|chrons) is persisted for post-approval payout (merits sticky on same-day merges).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWorkReport'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewWorkReport'
        required: true
      responses:
        '200':
          description: returns the new work report node ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewWReportResponse'
      security: *id001
  /rovas/rules/rules_proxy_delete_work_report:
    post:
      tags:
      - classic-projects
      summary: Delete a work report
      requestBody:
        description: If allowed, deletes a work report. Only own reports are deletable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkReport'
          application/xml:
            schema:
              $ref: '#/components/schemas/DeleteWorkReport'
        required: true
      responses:
        '200':
          description: Returns 1 if deleted succesfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWorkReportResponse'
      security: *id001
  /rovas/rules/rules_proxy_work_report_verifiability:
    post:
      tags:
      - classic-projects
      summary: Finds out if work report is verifiable by an user
      requestBody:
        description: The call finds out if report is verifiable and sets an environmental variable in
          Rovas that locks one of two/three verifiacation slots for 10 minutes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkReportVerifiability'
          application/xml:
            schema:
              $ref: '#/components/schemas/WorkReportVerifiability'
        required: true
      responses:
        '200':
          description: returns 1 or 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiabilityResponse'
      security: *id001
  /rovas/rules/rules_proxy_report_editability:
    post:
      tags:
      - classic-projects
      summary: Finds out if work report is editable by an user
      requestBody:
        description: The call determines if a report can be edited by the user identified by the API key
          and the token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Editability'
          application/xml:
            schema:
              $ref: '#/components/schemas/Editability'
        required: true
      responses:
        '200':
          description: returns 1 or 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditabilityResponse'
      security: *id001
  /rovas/rules/rules_create_user:
    post:
      tags:
      - classic-accounts
      summary: Create or link a Rovas user (third-party integration)
      description: |
        For partner backends using an **api client** Rovas account: creates a new user or links
        HybridAuth identity when the email already exists. Requires permission
        `access services_rules rules_create_user` (api client / administrator roles).
        JSON keys match Rules variables; optional `hybridauth_provider` defaults to Nabezky if empty.
        Use GET `/rovas/rovas_hybridauth_providers.json` to list valid provider ids.
      requestBody:
        description: Rule parameters (see rovas_site_rules README).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
        required: true
      responses:
        '200':
          description: Rovas user id and `rovas_endpoint` API credentials for that user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
        '401':
          description: Missing or invalid API credentials.
        '403':
          description: Caller lacks permission to invoke this rule.
      security: *id001
  /rovas/rovas_partner_user:
    post:
      tags:
      - classic-accounts
      summary: Create or link a Rovas user (partner API, replaces rules_create_user)
      description: |
        Same purpose as `POST /rovas/rules/rules_create_user`, implemented as a native Services resource
        for stricter validation and easier evolution. Requires permission
        `access services_rules rules_create_user` and the same API client headers as other `rovas_endpoint` calls.
        **user_country** must be two **uppercase** ASCII letters (ISO 3166-1 alpha-2) and must exist in the
        site country list. **user_language** is normalized to an **enabled** Drupal interface language
        (`rovas_base_map_partner_user_language`). Request body schema matches **RulesCreateUserRequest**.
      requestBody:
        description: Same fields as rules_create_user (see RulesCreateUserRequest).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/RulesCreateUserRequest'
        required: true
      responses:
        '200':
          description: Rovas user id and `rovas_endpoint` API credentials for that user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/RulesCreateUserResponse'
        '400':
          description: Validation error (country code, language, URL, email, provider, etc.).
        '401':
          description: Missing or invalid API credentials.
        '403':
          description: Caller lacks permission.
        '500':
          description: Server or registration failure.
      security: *id001
  /rovas/rules/rules_create_verification:
    post:
      tags:
      - classic-projects
      summary: Create a verification record
      requestBody:
        description: Creates a verification record for the work report.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerification'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateVerification'
        required: true
      responses:
        '200':
          description: returns verification record ID if successful, -1 otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
      security: *id001
  /rovas/rules/rules_proxy_create_aur:
    post:
      tags:
      - classic-commerce
      summary: Create an asset usage record, to charge a fee to an user for using somebody else's product
      requestBody:
        description: Creates an asset usage record.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAUR'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateAUR'
        required: true
      responses:
        '200':
          description: returns AUR record ID if successful, 0 or -1 otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAURResponse'
      security: *id001
  /rovas/rules/rules_create_verification_with_acccess_token:
    post:
      tags:
      - classic-projects
      summary: Create a verification record
      requestBody:
        description: Creates a verification record for the work report using access token and Rovas user
          ID. No API-KEY and TOKEN are needed in header.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationAT'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateVerificationAT'
        required: true
      responses:
        '200':
          description: returns verification record ID if successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationATResponse'
      security: &id002 []
  /rovas/rules/rules_proxy_purchase_product:
    post:
      tags:
      - classic-commerce
      summary: Process purchase of a product.
      requestBody:
        description: Creates purchase receipts, processes Chron transactions, distributes Merits to shareholders
          and (optionally Chrons to the project owner).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPurchase'
          application/xml:
            schema:
              $ref: '#/components/schemas/NewPurchase'
        required: true
      responses:
        '200':
          description: returns an integer indicating the operation outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
      security: *id001
  /rovas/rules/rules_proxy_reward_work_report:
    post:
      tags:
      - classic-projects
      summary: Reward a work report
      requestBody:
        description: Rewards a work repor with merits equal to the chrons sent by the user identified
          by the API key and token sent in the header
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkReportReward'
          application/xml:
            schema:
              $ref: '#/components/schemas/WorkReportReward'
        required: true
      responses:
        '200':
          description: returns one of 0 or 1 as well as text explaining the ourcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkReportRewardResponse'
      security: *id001
  /rovas/rules/rules_users_chrons:
    post:
      tags:
      - classic-accounts
      summary: Retrieves user's Chron balances.
      responses:
        '200':
          description: If succesfull, returns the total and available user's chron balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersChronsResponse'
      security: *id001
  /rovas/rules/rules_fetch_user_data:
    post:
      tags:
      - classic-accounts
      summary: Retrieves user's Rovas profile info.
      responses:
        '200':
          description: If succesfull, returns information from the user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchUserDataResponse'
      security: *id001
  /rovas/rules/rules_user_s_merits:
    post:
      tags:
      - classic-accounts
      summary: Retrieves user's total and taxonomy category-specific Merit balances. Set the nace_id param
        to 0 to return all Merits from the user's work reports. Retrieval error is indicated by value
        -1000000000.0000001 for either of the result parameters. Note that total_merits might differ from
        the term_merits when nace_id = 0 is passed to the endpoint.
      requestBody:
        description: use Rovas NACE term ID as a parameter
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersMerits'
          application/xml:
            schema:
              $ref: '#/components/schemas/UsersMerits'
        required: true
      responses:
        '200':
          description: returns total and taxonomy-category-specific Merit balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeritsResponse'
      security: *id001
  /rovas/rules/rules_proxy_delete_project:
    post:
      tags:
      - classic-projects
      summary: Delete a project
      requestBody:
        description: Deletes a project and all related work reports, merit allocation shares and disputes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProject'
          application/xml:
            schema:
              $ref: '#/components/schemas/DeleteProject'
        required: true
      responses:
        '200':
          description: the 'result' parameter indicates the status of the operation - 0 for failure or
            1 for success. The 'result_explain' parameter informs about the reason for failure if the
            project was not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectResponse'
      security: *id001
  /rovas/rules/rules_proxy_report_verification_status:
    post:
      tags:
      - classic-projects
      summary: Get a work report verification status
      requestBody:
        description: Returns a count of verifications made and an integer indicating the number of approved
          verifications.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetVerifStatus'
          application/xml:
            schema:
              $ref: '#/components/schemas/GetVerifStatus'
        required: true
      responses:
        '200':
          description: the count_total shows the number of verifications and the result parameter encodes
            the number of approved ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVerifStatusResponse'
      security: *id001
  /rovas/rules/rules_get_merits_for_projects:
    post:
      tags:
      - classic-commerce
      summary: Takes a list of Rovas project IDs separated by pipe and returns current merit value for
        each of the projects.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMerits'
          application/xml:
            schema:
              $ref: '#/components/schemas/ProjectMerits'
        required: true
      responses:
        '200':
          description: returns a json-encoded string of project IDs and their merits;
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMeritsResponse'
      security: *id001
  /rovas/rules/rules_convert_euros_to_chrons:
    post:
      tags:
      - classic-commerce
      summary: Returns the amount of Chrons one can buy with the given Euros.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
          application/xml:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
        required: true
      responses:
        '200':
          description: returns a decimal representing the Chron amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertChronsResponse'
      security: *id001
  /rovas/rules/rules_convert_euros_to_chrons_reverse:
    post:
      tags:
      - classic-commerce
      summary: Returns the amount of Chrons one has to pay to receive the given Euros.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
          application/xml:
            schema:
              $ref: '#/components/schemas/ConvertChrons'
        required: true
      responses:
        '200':
          description: returns a decimal representing the Chron amount, or -1 if user not found, or -2
            if the euro amount exceeds the number of Euros available for exchange in Rovas;
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertChronsResponse'
      security: *id001
  /rovas/rules/rules_proxy_check_verifier_by_access_tokens:
    post:
      tags:
      - classic-projects
      summary: given access token and verifier ID, determines verifiability of a work report
      requestBody:
        description: Returns TRUE if a verification slip exists for the tokens supplied
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckVerifAccessTokens'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckVerifAccessTokens'
        required: true
      responses:
        '200':
          description: returns 1 if user can verify the content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckVerifAccessTokensResponse'
      security: *id001
  /rovas/rules/rules_proxy_check_or_add_shareholder:
    post:
      tags:
      - classic-commerce
      summary: Checks that user is shareholder in a project. If not and possible, makes the user a shareholder.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAddShareholder'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckAddShareholder'
        required: true
      responses:
        '200':
          description: returns the Merit allocation node ID if successfull and 0 or negative integer otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAddShareholResponse'
      security: *id001
  /rovas/rules/rules_proxy_check_or_add_project_shareholder:
    post:
      tags:
      - classic-commerce
      summary: Checks that a project is a shareholder in a project. If not and possible, creates time,
        or percentage-based share.
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAddProjectShareholder'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckAddProjectShareholder'
        required: true
      responses:
        '200':
          description: returns the Merit allocation node ID if successfull and a negative integer otherwise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAddProjectShareholResponse'
      security: *id001
  /rovas/rules/rules_check_enabled_language:
    post:
      tags:
      - classic-accounts
      summary: Checks that a language identified by its 2-letter code is enabled
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEnabledLang'
          application/xml:
            schema:
              $ref: '#/components/schemas/CheckEnabledLang'
        required: true
      responses:
        '200':
          description: returns a 1 if the specified language is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckEnabledLangResponse'
      security: *id001
  /rovas/views/top_10_workers_in_a_category:
    get:
      summary: Get top x workers in a given category.
      tags:
      - classic-views
      responses:
        '200':
          description: json encoded array
          content:
            application/json:
              schema:
                type: string
                example: '[{"rank":"1","rovas_uid":"289","merits":"19.20"},{"rank":"2","rovas_uid":"347","merits":"15.35"},{"rank":"3","rovas_uid":"520","merits":"14.13"}]'
      security: *id001
    parameters:
    - name: display_id
      in: query
      description: the view display ID.
      required: true
      schema:
        type: string
        enum:
        - services_1
        example: services_1
    - name: filters[tid_raw]
      in: query
      description: Rovas category node ID
      required: false
      schema:
        $ref: '#/components/schemas/RovasTerms'
      example: 1794
    - name: filters[field_web_address_value]
      in: query
      description: The work report source url
      required: false
      schema:
        type: string
      example: nabezky.sk
    - name: limit
      in: query
      description: the number of records to be returned. If omitted, 10 records are returned
      required: false
      schema:
        type: integer
      example: 10
  /rovas/views/project_merits_feed:
    get:
      summary: Get top x users, who rewarded a project
      tags:
      - classic-views
      responses:
        '200':
          description: json encoded array of Rovas user ID, user name and the merits earned
          content:
            application/json:
              schema:
                type: string
                example: '[{"rovas_uid":"111","name":"machyeior","merits":"0.18"},{"rovas_uid":"1111","name":"K\u00edt\u011bzslav
                  Huenfky","merits":"0.14"},{"rovas_uid":"2222","name":"heiodnkaoecny","merits":"0.11"}]'
      security: *id001
    parameters:
    - name: display_id
      in: query
      description: the view display ID.
      required: true
      schema:
        type: string
        enum:
        - services_1
        example: services_1
    - name: filters[project_id]
      in: query
      description: Rovas project ID
      required: true
      schema:
        type: integer
      example: 12900
    - name: limit
      in: query
      description: the number of records to be returned. If omitted, 1 record is returned
      required: false
      schema:
        type: integer
      example: 10
  /rovas/views/projects_merits:
    get:
      summary: Get top x users, for projects from the same web site
      tags:
      - classic-views
      responses:
        '200':
          description: 'json encoded array of: rank in the hierarchy, Rovas user ID, merit score for the
            user and the number of projects that share the same field_asset_web_address_value'
          content:
            application/json:
              schema:
                type: string
                example: '[{"rank": "1","rovas_uid": "289","merits": "131.65","count": "65"},{"rank":
                  "2","rovas_uid": "896",  "merits": "115.48","count": "48"},{"rank": "3","rovas_uid":
                  "520","merits": "91.94","count": "56"}]'
      security: *id001
    parameters:
    - name: display_id
      in: query
      description: the view display ID.
      required: true
      schema:
        type: string
        enum:
        - services
        example: services_1
    - name: filters[field_asset_web_address_value]
      in: query
      description: a part of the url the project refers to
      required: true
      schema:
        type: string
      example: nabezky.sk/node/
    - name: limit
      in: query
      description: the number of records to be returned.
      required: false
      schema:
        type: integer
      example: 10
  /rovas/rovas_verifications.json:
    get:
      summary: Get list of work report verifications
      tags:
      - classic-projects
      responses:
        '200':
          description: JSON encoded array of verifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationsResponse'
              example:
                status: success
                count: 41
                verifications:
                - report_nid: '429357'
                  report_title: Creating map data with JOSM
                  verify_date: '1753086074'
                  verify_date_formatted: Mon, 07/21/2025 - 10:21
                  report_url: https://dev.rovas.app/node/429357
                - report_nid: '429454'
                  report_title: Creating map data with JOSM
                  verify_date: '1753086073'
                  verify_date_formatted: Mon, 07/21/2025 - 10:21
                  report_url: https://dev.rovas.app/node/429454
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
        description: Expected response format.
      - in: header
        name: Content-Type
        schema:
          type: string
        required: false
        example: application/json
        description: Content type of the request.
      security: *id001
  /rovas/rovas_comment_notices.json:
    get:
      summary: Get pending watched-comment notices
      description: |
        Pending in-app/API notices for new comments on nodes the key owner is watching
        (same Comment Notify audience as follow-up email). Poll-based; not an outbound
        webhook. Twin of Bearer `GET /rovas/civic_pending_comment_notices` (different
        response envelope). Requires module `rovas_comment_watch`. Path is
        `/rovas/rovas_comment_notices` (not under `/rovas/rules/`).
      tags:
      - classic-projects
      responses:
        '200':
          description: JSON list of pending comment notices for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentNoticesResponse'
              example:
                status: success
                count: 1
                notices:
                - nid: 123
                  node_title: Example post
                  cid: 456
                  comment_url: https://dev.rovas.app/comment/456
                  created: 1729100000
        '401':
          description: Missing or invalid API-KEY / TOKEN
        '500':
          description: Comment watch module unavailable or query failure
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
        description: Expected response format.
      security: *id001
  /rovas/rovas_hybridauth_providers.json:
    get:
      tags:
      - classic-accounts
      summary: List HybridAuth providers for account linking
      description: |
        Public endpoint: no `API-KEY` or `TOKEN` headers. Returns provider machine names
        enabled in HybridAuth—the same values allowed as `hybridauth_provider` in
        `rules_create_user`. The Services endpoint must have **Disable API keys authentication**
        enabled for this resource operation (`rovas_endpoint` → Resources →
        `rovas_hybridauth_providers` → index).
      parameters:
      - in: header
        name: Accept
        schema:
          type: string
        required: false
        example: application/json
      responses:
        '200':
          description: Enabled providers for UI picker and for `rules_create_user.hybridauth_provider`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HybridAuthProvidersResponse'
              example:
                status: success
                providers:
                - id: Nabezky
                  name: Nabezky
      security: *id002
  /oauth2/authorize:
    get:
      tags:
      - oauth-protocol
      summary: OAuth 2 authorization endpoint (browser)
      security: *id002
      description: |-
        Browser authorization with PKCE. Civic supports query extras `lang=sk|en` and `intent=login|register`.

        Civic client (reference): `client_id=civic`, public (no secret), grants `authorization_code` + `refresh_token`, PKCE `S256`, scope `user_profile`, redirect `civic://oauth/callback`.
      parameters:
      - in: query
        name: response_type
        required: true
        schema:
          type: string
          enum:
          - code
      - in: query
        name: client_id
        required: true
        schema:
          type: string
          example: civic
      - in: query
        name: redirect_uri
        required: true
        schema:
          type: string
          example: civic://oauth/callback
      - in: query
        name: scope
        required: false
        schema:
          type: string
          example: user_profile
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: code_challenge
        required: true
        schema:
          type: string
      - in: query
        name: code_challenge_method
        required: true
        schema:
          type: string
          enum:
          - S256
      - in: query
        name: lang
        required: false
        schema:
          type: string
          enum:
          - sk
          - en
      - in: query
        name: intent
        required: false
        description: Land on login vs register.
        schema:
          type: string
          enum:
          - login
          - register
      responses:
        '302':
          description: Redirect to login/consent or back to redirect_uri with code
  /oauth2/token:
    post:
      tags:
      - oauth-protocol
      summary: Exchange authorization code or refresh token
      security: *id002
      description: Public client + PKCE. Use `application/x-www-form-urlencoded` body.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Invalid grant or request
  /oauth2/revoke:
    post:
      tags:
      - oauth-protocol
      summary: Revoke access or refresh token
      security: *id002
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum:
                  - access_token
                  - refresh_token
                client_id:
                  type: string
                  example: civic
      responses:
        '200':
          description: Revoked (or already invalid)
  /oauth2/tokens/{access_token}:
    get:
      tags:
      - oauth-protocol
      summary: Introspect access token
      security: *id002
      description: Returns `user_id`, `client_id`, `expires`, `scope`. 404 if invalid.
      parameters:
      - in: path
        name: access_token
