    VerificationItem:
      type: object
      properties:
        report_nid:
          type: string
          example: '429357'
        report_title:
          type: string
          example: Creating map data with JOSM
        verify_date:
          type: string
          description: UNIX timestamp (seconds)
          example: '1753086074'
        verify_date_formatted:
          type: string
          example: Mon, 07/21/2025 - 10:21
        report_url:
          type: string
          format: uri
          example: https://dev.rovas.app/node/429357
    VerificationsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
          example: 41
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/VerificationItem'
    CommentNoticeItem:
      type: object
      properties:
        nid:
          type: integer
          description: Node ID the comment belongs to
          example: 123
        node_title:
          type: string
          example: Example post
        cid:
          type: integer
          description: Comment ID that triggered the notice
          example: 456
        comment_url:
          type: string
          format: uri
          description: Absolute comment permalink
          example: https://dev.rovas.app/comment/456
        created:
          type: integer
          description: UNIX timestamp when the notice was created
          example: 1729100000
    CommentNoticesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
          example: 1
        notices:
          type: array
          items:
            $ref: '#/components/schemas/CommentNoticeItem'
    RulesCreateUserRequest:
      type: object
      required:
      - user_name
      - user_id
      - user_email
      - user_country
      - user_language
      - server_url
      properties:
        user_name:
          type: string
          description: Display name for the new or linked Rovas user.
          example: Jane Partner User
        user_id:
          type: integer
          description: External user id at the partner (HybridAuth provider_identifier).
          example: 12345
        user_email:
          type: string
          format: email
          description: Used to find an existing Rovas account by mail.
        user_country:
          type: string
          description: |
            ISO 3166-1 alpha-2 code (e.g. SK). The `rovas_partner_user` endpoint requires **uppercase**
            ASCII letters only; the legacy Rules endpoint did not enforce casing.
        user_language:
          type: string
          description: Language code; rule maps sk/cs to sk, default en.
          example: en
        server_url:
          type: string
          format: uri
          description: Partner base URL for HybridAuth profile link (e.g. trailing slash optional per
            client).
          example: https://partner.example/
        hybridauth_provider:
          type: string
          nullable: true
          description: |
            HybridAuth provider machine name (e.g. Nabezky). Omit or empty for default Nabezky.
            Must be enabled on the site; use GET rovas_hybridauth_providers to list options.
        partner_client_id:
          type: string
          nullable: true
          description: Optional metadata stored on the user (`rovas_partner_client_id`).
    RulesCreateUserResponse:
      type: object
      properties:
        rovas_uid:
          type: integer
          description: Rovas user id (new or existing).
        api_key:
          type: string
          description: API key for `rovas_endpoint` for that user.
        token:
          type: string
          description: Token for `rovas_endpoint` for that user.
    HybridAuthProviderItem:
      type: object
      properties:
        id:
          type: string
          description: Provider machine name; use as `hybridauth_provider` in rules_create_user.
        name:
          type: string
          description: Display label for UI.
    HybridAuthProvidersResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        providers:
          type: array
          items:
            $ref: '#/components/schemas/HybridAuthProviderItem'
    OAuthTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum:
          - authorization_code
          - refresh_token
        client_id:
          type: string
          example: civic
        redirect_uri:
          type: string
          example: civic://oauth/callback
        code:
          type: string
          description: Required for authorization_code
        code_verifier:
          type: string
          description: PKCE verifier for authorization_code
        refresh_token:
          type: string
          description: Required for refresh_token
      required:
      - grant_type
      - client_id
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        scope:
          type: string
          example: user_profile
    OAuthTokenIntrospection:
      type: object
      properties:
        user_id:
          type: integer
          description: Drupal uid
        client_id:
          type: string
        expires:
          type: integer
          description: Unix expiry
        scope:
          type: string
    MeResponse:
      type: object
      properties:
        uid:
          type: integer
        username:
          type: string
        display_name:
          type: string
        total_me:
          type: number
          format: float
        total_chr:
          type: number
          format: float
        created:
          type: string
          format: date-time
        language:
          type: string
        receipt_history_retention:
          description: '`null` | `keep` | `policy`'
          nullable: true
          oneOf:
          - type: string
            enum:
            - keep
            - policy
          - type: 'null'
        me_sources_share:
          type: string
          enum:
          - everyone
          - reciprocal
          - aggregate
        trusted_user:
          type: boolean
        trusted_notify:
          type: integer
          enum:
          - 0
          - 1
          - 2
          description: 0=no banner, 1=show, 2=dismissed
    ReceiptHistoryPreferenceRequest:
      type: object
      required:
      - retention
      properties:
        retention:
          type: string
          enum:
          - keep
          - policy
    ReceiptHistoryPreferenceResponse:
      type: object
      properties:
        receipt_history_retention:
          type: string
          enum:
          - keep
          - policy
    MeSourcesPreferenceRequest:
      type: object
      required:
      - share
      properties:
        share:
          type: string
          enum:
          - everyone
          - reciprocal
          - aggregate
    MeSourcesPreferenceResponse:
      type: object
      properties:
        me_sources_share:
          type: string
          enum:
          - everyone
          - reciprocal
          - aggregate
    GiveChronsRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: number
          format: float
          description: Positive Chrons to convert (1:1 to Merits)
          exclusiveMinimum: 0
    GiveChronsResponse:
      type: object
      properties:
        chrons_given:
          type: number
          format: float
        merits_gained:
          type: number
          format: float
        total_chr:
          type: number
          format: float
        total_me:
          type: number
          format: float
    TrustedNotifyDismissResponse:
      type: object
      properties:
        trusted_user:
          type: boolean
        trusted_notify:
          type: integer
          enum:
          - 0
          - 1
          - 2
    ClaimVatReceiptRequest:
      type: object
      description: eKasa VAT claim with optional Merit split across projects
      properties:
        receipt_uid:
          type: string
        shares:
          type: array
          items:
            type: object
            properties:
              project_nid:
                type: integer
              share:
                type: number
                format: float
    ClaimVatReceiptResponse:
      type: object
      description: Claim outcome (fields vary by implementation)
      properties:
        claimed:
          type: boolean
        receipt_uid:
          type: string
        merits:
          type: number
          format: float
    CivicCreateProjectRequest:
      type: object
      required:
      - name
      - description
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
    CivicCreateProjectResponse:
      type: object
      properties:
        nid:
          type: integer
    CivicCreateWorkReportRequest:
      type: object
      required:
      - project_nid
      - date_started
      - hours
      - description
      - nace_tid
      properties:
        project_nid:
          type: integer
        date_started:
          type: string
          description: Work start date
        hours:
          type: number
          format: float
        description:
          type: string
        nace_tid:
          type: integer
        title:
          type: string
        web_url:
          type: string
          description: Work evidence URL
        photos:
          type: array
          items:
            type: string
          description: Base64 proof photos (client-redacted)
        reward_kind:
          type: string
          description: merits or chrons after approval (Trusted auto-approve or peer verify); merits sticky if WR is merged
        field_location:
          type: object
          description: 'GeoJSON geometry: Point, LineString, Polygon, or GeometryCollection'
        usage_fee_project_id:
          type: integer
        usage_fee_rate:
          type: number
          format: float
        photo_redact_mode:
          type: string
          description: Ignored if present; redact on the client before upload
    CivicCreateWorkReportResponse:
      type: object
      properties:
        nid:
          type: integer
    CivicSubmitVerificationRequest:
      type: object
      properties:
        work_report_nid:
          type: integer
        decision:
          type: string
          enum:
          - approve
          - reject
          - decline
        comment:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: API-KEY
      description: From My account → Rovas API for endpoint `rovas_endpoint`.
    TokenAuth:
      type: apiKey
      in: header
      name: TOKEN
      description: Paired with API-KEY for the same user.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 access_token
      description: OAuth 2 access token with scope `user_profile` (Civic client uses PKCE).
tags:
- name: classic-accounts
  description: Classic API — accounts and identity (API-KEY + TOKEN)
- name: classic-projects
  description: Classic API — projects, work reports, verification
- name: classic-commerce
  description: Classic API — shares, purchases, conversions
- name: classic-views
  description: Classic API — leaderboard / feed Views
- name: classic-nodes
  description: Classic API — allowlisted node retrieve/update/delete
- name: oauth-protocol
  description: OAuth 2 protocol (authorize, token, revoke, introspect)
- name: oauth-profile
  description: OAuth / Civic — home, profile, preferences
- name: oauth-users
  description: OAuth / Civic — user search and community lookup
- name: oauth-claims
  description: OAuth / Civic — tax claims (Path 1) and national rate
- name: oauth-projects
  description: OAuth / Civic — project detail, charity catalog, gifts
- name: oauth-volunteer
  description: OAuth / Civic — volunteer work reports
- name: oauth-verify
  description: OAuth / Civic — verification and notifications
- name: oauth-merit-index
  description: OAuth / Civic — Merit index and spotlight (public)
